name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: cowsay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cowsay
          POSTGRES_PASSWORD: cowsay
          POSTGRES_DB: cowsay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ secrets.ARTIFACT_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Update kustomization image tags
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" k8s/overlays/prd/kustomization.yaml
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" k8s/overlays/dev/kustomization.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add k8s/overlays/prd/kustomization.yaml k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ github.sha }}"
          git push

      - name: Dispatch deploy event to infrastructure repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ncx-ai/infrastructure
          event-type: deploy-service
          client-payload: '{"service": "cowsay", "sha": "${{ github.sha }}"}'
