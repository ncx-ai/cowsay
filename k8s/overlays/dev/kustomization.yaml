apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: cowsay
images:
  - name: cowsay
    # Replace YOUR_ARTIFACT_REGISTRY_URL with the real Artifact Registry URL
    # once (see ncx-ai/infrastructure's README) -- CI only ever updates newTag below.
    newName: us-east1-docker.pkg.dev/ncx-ai-prod/ncx/cowsay
    newTag: 748fdec6b4aa4c498dd6bd21c2557b887cea01e2
patches:
  - target:
      kind: Deployment
      name: cowsay
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
