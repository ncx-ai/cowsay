apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: cowsay
images:
  - name: cowsay
    # Replace YOUR_ARTIFACT_REGISTRY_URL with the real Artifact Registry URL
    # once (see ncx-ai/infrastructure's README) -- CI only ever updates newTag below.
    newName: YOUR_ARTIFACT_REGISTRY_URL/cowsay
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: cowsay
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
