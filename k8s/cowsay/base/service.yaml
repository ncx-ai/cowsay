apiVersion: v1
kind: Service
metadata:
  name: cowsay
  annotations:
    # Binds this Service's GCLB backend to the cowsay-cloudflare-only Cloud
    # Armor policy, which denies everything that is not a Cloudflare edge
    # range. Without it the origin load balancer IP answers directly and the
    # Cloudflare Access application in front of this hostname is bypassable --
    # measured returning 200 on both stacks before this landed, see
    # ncx-ai/infrastructure#267.
    #
    # The policy and the BackendConfig this names are created by pulumi in
    # ncx-ai/infrastructure (__main__.py's cowsay block), NOT here, and must
    # exist before this annotation is applied. One BackendConfig serves both
    # cowsay and cowsay-dark.
    cloud.google.com/backend-config: '{"default": "cowsay-cloudflare-only"}'
    # Container-native load balancing. Without it the GKE ingress controller
    # refuses to build a backend for a ClusterIP Service and the Ingress never
    # gets an address:
    #
    #   Translation failed: invalid ingress spec: service
    #   "cowsay/cowsay" is type "ClusterIP", expected "NodePort" or
    #   "LoadBalancer" when not using NEGs
    #
    # GKE's NEG controller usually adds this itself when an Ingress references a
    # ClusterIP Service on a VPC-native cluster, but not reliably. Added here
    # preventively -- cowsay prod already has a working address (its Ingress is
    # pulumi-created and has run for weeks without this annotation), but
    # cowsay-dark's first prod sync (2026-09-23) hit exactly this translation
    # error and sat retrying for 32+ minutes with a healthy cert and healthy
    # pods, never getting an address, until the annotation was added by hand.
    # ncx-ai/api-gateway hit the identical failure on 2026-09-13. Declaring it
    # here removes the dependency on controller behaviour that is only
    # observable when it fails -- including on a future Ingress recreate.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: cowsay
  ports:
    - port: 80
      targetPort: 8000
