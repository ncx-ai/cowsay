apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-dark-ingress
spec:
  tls:
    - hosts:
        - cowsay-dark-dev.keld.co
      secretName: cowsay-dark-dev-tls
  rules:
    - host: cowsay-dark-dev.keld.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-dark-service
                port:
                  number: 80
