apiVersion: v1
kind: Service
metadata:
  name: cowsay-dark
  annotations:
    # Binds this Service's GCLB backend to the cowsay-cloudflare-only Cloud
    # Armor policy, which denies everything that is not a Cloudflare edge
    # range. Without it the origin load balancer IP answers directly,
    # regardless of what sits at the Cloudflare edge -- measured returning 200
    # on dev's 34.49.5.242 before this landed, see ncx-ai/infrastructure#267.
    #
    # This host was the worse of the two: unlike cowsay-dev, it had no
    # Cloudflare Access application either, so it was reachable by anyone both
    # through Cloudflare and around it. The Access application is configured by
    # hand at the Cloudflare edge and is NOT represented anywhere in git --
    # this annotation closes the origin half only.
    #
    # The policy and the BackendConfig this names are created by pulumi in
    # ncx-ai/infrastructure (__main__.py's cowsay block), NOT here, and must
    # exist before this annotation is applied. One BackendConfig serves both
    # cowsay and cowsay-dark.
    cloud.google.com/backend-config: '{"default": "cowsay-cloudflare-only"}'
spec:
  selector:
    app: cowsay-dark
  ports:
    - port: 80
      targetPort: 8000
