services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cowsay
      POSTGRES_PASSWORD: cowsay
      POSTGRES_DB: cowsay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowsay"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      # Host port is overridable so `make up PORT=8100` works when 8000 is taken.
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://cowsay:cowsay@postgres:5432/cowsay
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
